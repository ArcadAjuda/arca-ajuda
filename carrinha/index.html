:root{
  --azul:#1B4164; --azul-d:#123050; --azul-l:#E6F4FB; --bg:#EAF3F9; --card:#fff;
  --celeste:#75D1F8; --celeste-d:#37A7C8; --dourado:#F4A62A;
  --laranja:#F26419; --laranja-d:#D24E0A; --laranja-l:#FFF0E6;
  --linha:#e8eef3; --rosa:#E63946; --roxo:#6A4C93;
  --texto:#16232E; --texto-2:#556; --texto-3:#8894a0;
  --verde:#2A9D8F; --radius:18px; --sombra:0 6px 24px rgba(24,62,98,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  overflow:hidden; height:100dvh; -webkit-tap-highlight-color:transparent;
  user-select:none;
}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* Separadores no topo — mostram o que há em cada página */
#tabs{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:6px;background:rgba(0,0,0,.22);padding:5px;border-radius:26px;
  backdrop-filter:blur(4px);
}
#tabs.dark{background:rgba(27,65,100,.14)}
#tabs .tab{
  font-size:12px;font-weight:800;letter-spacing:.2px;color:rgba(255,255,255,.85);
  padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
  transition:background .25s,color .25s;
}
#tabs.dark .tab{color:var(--azul)}
#tabs .tab.on{background:#fff;color:var(--azul-d)}
#tabs.dark .tab.on{background:var(--azul);color:#fff}
/* Faixa inferior — anuncia a página seguinte e avança ao toque */
#nextBar{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:var(--azul-d);color:#fff;font-size:14px;font-weight:800;
  padding:13px 22px;border-radius:30px;cursor:pointer;border:0;
  box-shadow:0 6px 18px rgba(0,0,0,.3);
  animation:nextPulse 1.8s ease infinite;
}
@keyframes nextPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
#nextBar.hide{display:none}

#stage{position:relative;width:100%;height:100%}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .55s ease;
  padding:34px 22px 92px;overflow-y:auto;
}
.slide.active{opacity:1;pointer-events:auto;z-index:2}

.kicker{
  align-self:center;font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;background:rgba(255,255,255,.18);color:#fff;
  padding:6px 14px;border-radius:20px;margin-bottom:14px;backdrop-filter:blur(2px);
}
.slide-parceiro .kicker{background:linear-gradient(135deg,var(--celeste-d),var(--azul));color:#fff;box-shadow:0 2px 8px rgba(55,167,200,.35)}

/* ---- Slide: Historial ---- */
.slide-historial{
  background:linear-gradient(120deg,#0E2B4A 0%,#1B4164 38%,#2E86AB 72%,#37A7C8 100%);
  background-size:200% 200%;animation:gradShift 16s ease infinite;color:#fff;
  align-items:center;text-align:center;justify-content:flex-start;padding-top:62px;
}
.slide-historial .kicker{margin-bottom:10px}
.logo-arca{
  width:88px;height:88px;border-radius:22px;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.28);margin-bottom:10px;
}
.logo-arca img{max-width:82%;max-height:82%;object-fit:contain}
h1.arca-title{
  font-family:'Mistral',cursive;font-weight:normal;font-size:clamp(42px,13vw,66px);
  margin:0 0 2px;text-shadow:0 3px 16px rgba(0,0,0,.3);line-height:1;
}
.sub-loc{font-size:12.5px;opacity:.85;margin:0 0 14px;letter-spacing:.3px}
.historial-texto{
  max-width:520px;font-size:15px;line-height:1.55;color:#EAF3F9;
  text-shadow:0 1px 6px rgba(0,0,0,.18);margin:0;
}
@media (min-width:700px){.historial-texto{font-size:16.5px;line-height:1.65}}
.social-row{display:flex;gap:13px;margin-top:16px;justify-content:center}
.social-row a{
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.3);text-decoration:none;
  border:2px solid rgba(255,255,255,.85);
}
.social-row svg{width:23px;height:23px;fill:#fff}
.soc-fb{background:#1877F2}
.soc-ig{background:radial-gradient(circle at 30% 110%,#FDDC5C 0%,#F77737 30%,#E1306C 55%,#C13584 75%,#833AB4 100%)}
.soc-yt{background:#FF0000}
.soc-blog{background:var(--verde)}
.contactos-row{
  margin-top:13px;display:flex;flex-direction:column;gap:5px;align-items:center;
  font-size:13px;line-height:1.45;
}
.contactos-row a{color:#fff;text-decoration:none;font-weight:600;opacity:.95}
.contactos-row .morada{font-size:12px;opacity:.75;max-width:420px}

/* ---- Slide: Parceiros (grelha única) ---- */
.slide-parceiros{background:var(--bg);align-items:center;justify-content:flex-start;padding-top:62px}
.slide-parceiros .kicker{background:linear-gradient(135deg,var(--celeste-d),var(--azul));color:#fff;box-shadow:0 2px 8px rgba(55,167,200,.35)}
.p-grid{
  width:100%;max-width:520px;display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;padding-bottom:64px;
}
/* Em ecrãs maiores (PC/tablet), os logos preenchem a página em mais colunas */
@media (min-width:700px){
  .p-grid{max-width:1100px;grid-template-columns:repeat(3,1fr);gap:16px}
  .p-item-logo{height:96px}
  .p-item-nome{font-size:14px}
  .p-item-desc{font-size:13px}
}
@media (min-width:1100px){
  .p-grid{max-width:1400px;grid-template-columns:repeat(4,1fr)}
  .p-item-logo{height:110px}
}
.p-item{
  background:var(--card);border-radius:14px;box-shadow:var(--sombra);
  padding:12px 10px 12px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:7px;
}
.p-item-logo{
  width:100%;height:64px;border-radius:10px;
  background:linear-gradient(145deg,#f2f9fd,#e8f3f9);border:1px solid var(--linha);
  display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px;
}
.p-item-logo img{max-width:100%;max-height:100%;object-fit:contain}
.p-item-nome{font-size:12px;font-weight:800;color:var(--azul-d);line-height:1.2}
.p-item-desc{
  font-size:12px;font-weight:800;color:var(--azul-d);line-height:1.3;
  background:var(--azul-l);border-radius:8px;padding:4px 8px;
}

/* ---- Slide: CTA sócio ---- */
.slide-cta{
  background:linear-gradient(135deg,var(--verde) 0%,var(--celeste-d) 55%,var(--azul) 100%);
  color:#fff;align-items:center;justify-content:center;text-align:center;
}
.cta-emoji{font-size:56px;margin-bottom:6px}
.slide-cta h2{font-family:'Mistral',cursive;font-weight:normal;font-size:clamp(36px,10vw,50px);margin:0 0 10px;text-shadow:0 3px 16px rgba(0,0,0,.25)}
.cta-texto{max-width:440px;font-size:16px;line-height:1.6;margin-bottom:26px;text-shadow:0 1px 6px rgba(0,0,0,.15)}
.cta-btn{
  display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--azul-d);
  font-weight:800;font-size:17px;padding:16px 30px;border-radius:50px;text-decoration:none;
  box-shadow:0 8px 22px rgba(0,0,0,.28);transition:transform .15s;
}
.cta-btn:active{transform:scale(.96)}

#loading{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:14px;z-index:100;color:var(--azul-d);
  font-weight:700;font-size:14px;
}
.spinner{width:34px;height:34px;border:4px solid var(--azul-l);border-top-color:var(--azul);border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading.hide{display:none}

.tap-hint{position:fixed;right:14px;bottom:70px;font-size:11px;color:rgba(255,255,255,.0);z-index:5}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>A carregar…</div>

<div id="tabs"></div>

<div id="stage">

  <section class="slide slide-historial active" data-slide="historial">
    <div class="kicker">Associação Recreativa e Cultural da Ajuda</div>
    <div class="logo-arca" id="logoArcaBox"><img id="logoArca" alt="ARCA d'Ajuda" style="display:none"></div>
    <h1 class="arca-title">ARCA d'Ajuda</h1>
    <p class="sub-loc">Ajuda · São Martinho · Funchal, Madeira</p>
    <p class="historial-texto" id="txtHistorial"></p>
    <div class="social-row">
      <a id="lnkFacebook" class="soc-fb" href="#" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M13.5 21v-8.2h2.8l.4-3.2h-3.2V7.6c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.3v3.2h2.8V21h3.4z"/></svg>
      </a>
      <a id="lnkInstagram" class="soc-ig" href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 4.3c2.5 0 2.8 0 3.8.1 1 0 1.5.2 1.8.3.5.2.8.4 1.1.7.3.3.5.7.7 1.1.1.3.3.9.3 1.8 0 1 .1 1.3.1 3.8s0 2.8-.1 3.8c0 1-.2 1.5-.3 1.8-.2.5-.4.8-.7 1.1-.3.3-.7.5-1.1.7-.3.1-.9.3-1.8.3-1 0-1.3.1-3.8.1s-2.8 0-3.8-.1c-1 0-1.5-.2-1.8-.3-.5-.2-.8-.4-1.1-.7-.3-.3-.5-.7-.7-1.1-.1-.3-.3-.9-.3-1.8 0-1-.1-1.3-.1-3.8s0-2.8.1-3.8c0-1 .2-1.5.3-1.8.2-.5.4-.8.7-1.1.3-.3.7-.5 1.1-.7.3-.1.9-.3 1.8-.3 1-.1 1.3-.1 3.8-.1M12 2.6c-2.6 0-2.9 0-3.9.1-1 0-1.7.2-2.3.4-.6.3-1.2.6-1.7 1.1-.5.5-.9 1.1-1.1 1.7-.2.6-.4 1.3-.4 2.3-.1 1-.1 1.3-.1 3.9s0 2.9.1 3.9c0 1 .2 1.7.4 2.3.3.6.6 1.2 1.1 1.7.5.5 1.1.9 1.7 1.1.6.2 1.3.4 2.3.4 1 .1 1.3.1 3.9.1s2.9 0 3.9-.1c1 0 1.7-.2 2.3-.4.6-.3 1.2-.6 1.7-1.1.5-.5.9-1.1 1.1-1.7.2-.6.4-1.3.4-2.3.1-1 .1-1.3.1-3.9s0-2.9-.1-3.9c0-1-.2-1.7-.4-2.3-.3-.6-.6-1.2-1.1-1.7-.5-.5-1.1-.9-1.7-1.1-.6-.2-1.3-.4-2.3-.4-1-.1-1.3-.1-3.9-.1zm0 4.6a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6zm0 7.9a3.1 3.1 0 1 1 0-6.2 3.1 3.1 0 0 1 0 6.2zM18 6.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0z"/></svg>
      </a>
      <a id="lnkYoutube" class="soc-yt" href="#" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24"><path d="M21.6 7.2s-.2-1.4-.8-2c-.7-.8-1.5-.8-1.9-.8C16.2 4.2 12 4.2 12 4.2s-4.2 0-6.9.2c-.4 0-1.2 0-1.9.8-.6.6-.8 2-.8 2S2.2 8.9 2.2 10.5v1.5c0 1.6.2 3.3.2 3.3s.2 1.4.8 2c.7.8 1.7.7 2.1.8 1.5.1 6.7.2 6.7.2s4.2 0 6.9-.2c.4 0 1.2 0 1.9-.8.6-.6.8-2 .8-2s.2-1.6.2-3.3v-1.5c0-1.6-.2-3.3-.2-3.3zM9.9 14.7V8.9l5.4 2.9-5.4 2.9z"/></svg>
      </a>
      <a id="lnkBlog" class="soc-blog" href="#" target="_blank" rel="noopener" aria-label="Blog">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm7.4 9h-3.1a15 15 0 0 0-1.1-5.3A8 8 0 0 1 19.4 11zM12 4.1c.9 1.1 1.9 3.1 2.2 6.9H9.8c.3-3.8 1.3-5.8 2.2-6.9zM4.6 13h3.1c.1 1.9.5 3.7 1.1 5.3A8 8 0 0 1 4.6 13zm3.1-2H4.6a8 8 0 0 1 4.2-5.3A15 15 0 0 0 7.7 11zM12 19.9c-.9-1.1-1.9-3.1-2.2-6.9h4.4c-.3 3.8-1.3 5.8-2.2 6.9zm3.2-1.6a15 15 0 0 0 1.1-5.3h3.1a8 8 0 0 1-4.2 5.3z"/></svg>
      </a>
    </div>
    <div class="contactos-row">
      <div><a id="lnkTelemovel" href="#">📱 <span></span></a> &nbsp;·&nbsp; <a id="lnkTelefone" href="#">☎️ <span></span></a></div>
      <div><a id="lnkEmail" href="#">✉️ <span></span></a></div>
      <div class="morada" id="txtMorada"></div>
    </div>
  </section>

  <section class="slide slide-parceiros" data-slide="parceiros">
    <div class="kicker">Vantagens para Associados</div>
    <div class="p-grid" id="pGrid"></div>
  </section>

  <section class="slide slide-cta" data-slide="cta">
    <div class="cta-emoji">🤝</div>
    <h2>Torna-te Sócio</h2>
    <p class="cta-texto" id="txtConvite"></p>
    <a class="cta-btn" id="ctaBtn" href="#">✍️ Fazer inscrição de sócio</a>
  </section>

</div>

<button id="nextBar" type="button"></button>

<script>
/* ==========================================================================
   ZONA EDITÁVEL — pode alterar os valores entre aspas e gravar (Commit).
   Para esconder uma rede social ou contacto, deixe as aspas vazias: ""
   NÃO apague as vírgulas nem as aspas!
   ========================================================================== */
var CONFIG = {

  // Texto do historial (primeira página)
  texto_historial: "Fundada a 29 de junho de 2011, a ARCA d'Ajuda nasceu da tradição da Festa de Nossa Senhora da Ajuda, em São Martinho. É uma associação sem fins lucrativos que promove a cultura, o desporto e o lazer — das festas tradicionais ao ARCAKIDS e às modalidades desportivas — levando a Ajuda mais além.",

  // Texto do convite a sócio (última página)
  texto_convite: "Faça parte desta família! Ser sócio da ARCA d'Ajuda é apoiar a cultura, o desporto e a vida da nossa comunidade — e ainda beneficiar de descontos exclusivos com os nossos parceiros. A inscrição é rápida e pode ser feita aqui mesmo, online.",

  // Link do formulário de inscrição de sócio
  link_inscricao: "https://arca-ajuda.github.io/arca-ajuda/socios/inscricao/",

  // Redes sociais
  facebook:  "https://www.facebook.com/ArcaDajuda",
  instagram: "https://www.instagram.com/arcadajuda/",
  youtube:   "https://www.youtube.com/channel/UCw9ttQA2z4UGWPDLla-zTgg",
  blog:      "https://arcadajuda.blogspot.com",

  // Contactos
  telemovel: "932 341 062",
  telefone:  "291 617 298",
  email:     "arcadajuda@gmail.com",
  morada:    "Rua Velha da Ajuda n.º 89, Edifício Vale da Ajuda, 9000-749 Funchal"
};
/* ========================= FIM DA ZONA EDITÁVEL ========================= */

(function(){
  var SUPA_URL = 'https://yfsyifypsrqnwkqkfrnm.supabase.co';
  var SUPA_KEY = 'sb_publishable_AkzlMeHlYHDyl0HzeC7_qg__j_Y6C9W';
  var HEADERS = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY };

  var stage = document.getElementById('stage');
  var loading = document.getElementById('loading');
  var tabsBox = document.getElementById('tabs');
  var nextBar = document.getElementById('nextBar');
  var slideHistorial = document.querySelector('.slide-historial');
  var slideParceiros = document.querySelector('.slide-parceiros');
  var pGrid = document.getElementById('pGrid');
  var slideCta = document.querySelector('.slide-cta');

  /* ---- Aplicar a ZONA EDITÁVEL (CONFIG) à página ---- */
  function aplicarConfig(){
    document.getElementById('txtHistorial').textContent = CONFIG.texto_historial || '';
    document.getElementById('txtConvite').textContent = CONFIG.texto_convite || '';
    document.getElementById('ctaBtn').href = CONFIG.link_inscricao || '#';

    var redes = { lnkFacebook: CONFIG.facebook, lnkInstagram: CONFIG.instagram,
                  lnkYoutube: CONFIG.youtube, lnkBlog: CONFIG.blog };
    Object.keys(redes).forEach(function(id){
      var el = document.getElementById(id);
      if (redes[id]) el.href = redes[id]; else el.style.display = 'none';
    });

    function contacto(id, valor, prefixo){
      var el = document.getElementById(id);
      if (!valor){ el.style.display = 'none'; return; }
      el.href = prefixo + valor.replace(/\s+/g,'');
      el.querySelector('span').textContent = valor;
    }
    contacto('lnkTelemovel', CONFIG.telemovel, 'tel:+351');
    contacto('lnkTelefone', CONFIG.telefone, 'tel:+351');
    contacto('lnkEmail', CONFIG.email, 'mailto:');
    var mor = document.getElementById('txtMorada');
    if (CONFIG.morada) mor.textContent = '📍 ' + CONFIG.morada; else mor.style.display = 'none';
  }

  /* ---- Slides e navegação por gesto (sem tempo) ---- */
  var slides = []; // { el, dark, tab, seguinte }
  var current = 0;

  function buildTabs(){
    tabsBox.innerHTML = '';
    slides.forEach(function(s, idx){
      var t = document.createElement('div');
      t.className = 'tab';
      t.textContent = s.tab;
      t.addEventListener('click', function(){ showSlide(idx); });
      tabsBox.appendChild(t);
    });
  }

  function showSlide(i){
    if (i < 0) i = 0;
    if (i > slides.length - 1) i = slides.length - 1;
    current = i;
    slides.forEach(function(s, idx){ s.el.classList.toggle('active', idx === i); });
    var tabs = tabsBox.children;
    for (var k = 0; k < tabs.length; k++) tabs[k].classList.toggle('on', k === i);
    tabsBox.classList.toggle('dark', !slides[i].dark);
    // Faixa inferior anuncia o que vem a seguir
    if (i < slides.length - 1){
      nextBar.textContent = slides[i].seguinte + '  →';
      nextBar.classList.remove('hide');
    } else {
      nextBar.classList.add('hide');
    }
  }

  nextBar.addEventListener('click', function(){ showSlide(current + 1); });

  // Deslizar com o dedo (esquerda = avançar, direita = voltar)
  var touchX = null, touchY = null;
  stage.addEventListener('touchstart', function(e){
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return; // gesto vertical = scroll
    if (dx < 0) showSlide(current + 1); else showSlide(current - 1);
  }, {passive:true});

  // No computador: clique avança, setas do teclado também
  stage.addEventListener('click', function(e){
    if (e.target.closest('a')) return;
    if ('ontouchstart' in window) return; // no telemóvel só o gesto navega
    showSlide(current + 1 > slides.length - 1 ? 0 : current + 1);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') showSlide(current + 1);
    if (e.key === 'ArrowLeft') showSlide(current - 1);
  });

  /* ---- Parceiros (em direto da base de dados) ---- */
  function vantagemCurta(v){
    if (!v) return '';
    var linhas = String(v).split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    if (!linhas.length) return '';
    var comPct = linhas.filter(function(l){ return /%|€|desconto|oferta/i.test(l); });
    var linha = (comPct[0] || linhas[0]);
    if (linha.length > 60) linha = linha.slice(0, 57).replace(/\s+\S*$/, '') + '…';
    return linha;
  }

  function buildParceirosGrid(parceiros){
    parceiros.forEach(function(p){
      var item = document.createElement('div');
      item.className = 'p-item';
      var logoBox = document.createElement('div');
      logoBox.className = 'p-item-logo';
      if (p.logo_url){
        var img = document.createElement('img');
        img.alt = p.nome || '';
        img.onerror = function(){ logoBox.style.display = 'none'; };
        img.src = p.logo_url;
        logoBox.appendChild(img);
      } else {
        logoBox.style.display = 'none';
      }
      item.appendChild(logoBox);
      var nome = document.createElement('div');
      nome.className = 'p-item-nome';
      nome.textContent = p.nome || '';
      item.appendChild(nome);
      var curta = vantagemCurta(p.vantagem);
      if (curta){
        var desc = document.createElement('div');
        desc.className = 'p-item-desc';
        desc.textContent = curta;
        item.appendChild(desc);
      }
      pGrid.appendChild(item);
    });
  }

  async function fetchJson(path){
    var res = await fetch(SUPA_URL + '/rest/v1/' + path, { headers: HEADERS });
    if (!res.ok) throw new Error('Supabase ' + path + ' -> ' + res.status);
    return res.json();
  }

  async function init(){
    aplicarConfig();
    slides.push({ el: slideHistorial, dark: true, tab: 'A ARCA', seguinte: '🤝 Ver Parceiros e Descontos' });

    // Logo institucional (ao vivo)
    try {
      var logoRows = await fetchJson('config_app?chave=eq.logo_arca&select=valor');
      if (logoRows && logoRows[0] && logoRows[0].valor){
        var logoImg = document.getElementById('logoArca');
        logoImg.src = logoRows[0].valor + '?v=' + Date.now();
        logoImg.style.display = '';
      }
    } catch(e){ /* sem logo, segue sem ele */ }

    // Parceiros ativos (ao vivo)
    try {
      var parceiros = await fetchJson('parceiros?ativo=eq.true&order=ordem.asc,nome.asc&select=*');
      if (parceiros && parceiros.length){
        buildParceirosGrid(parceiros);
        slides.push({ el: slideParceiros, dark: false, tab: 'Parceiros', seguinte: '✍️ Torna-te Sócio' });
      }
    } catch(e){ /* sem parceiros de momento, a página segue sem essa tela */ }

    slides.push({ el: slideCta, dark: false, tab: 'Sê Sócio', seguinte: '' });
    // Se não houver parceiros disponíveis, a página a seguir ao historial é o convite
    if (slides.length === 2) slides[0].seguinte = '✍️ Torna-te Sócio';

    buildTabs();
    loading.classList.add('hide');
    showSlide(0);
  }

  init();
})();

</script>
</body>
</html>
